<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף של ניב</title>
<meta name="description" content="הדף המיוחד של ניב.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
  :root {
    --bg: #fff3f8;
    --ink: #2b2140;
    --muted: #6b5f80;
    --pink: #ff6b9d;
    --orange: #ff9f43;
    --green: #4cd18a;
    --blue: #4d96ff;
    --purple: #9b5de5;
    --spotify: #1db954;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Varela Round", "Arial Hebrew", Arial, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(255, 107, 157, .18) 2px, transparent 0);
    background-size: 28px 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }

  h1 { font-size: clamp(3rem, 14vw, 6rem); margin: 0; line-height: 1.1; }
  h1 .name span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  h1 .name span:nth-child(1) { color: var(--pink); }
  h1 .name span:nth-child(2) { color: var(--purple); animation-delay: -.8s; }
  h1 .name span:nth-child(3) { color: var(--orange); animation-delay: -1.6s; }
  h1 .wave { display: inline-block; animation: wave 1.6s ease-in-out infinite; transform-origin: 70% 70%; }

  .floaters { font-size: clamp(2rem, 9vw, 3rem); margin: 18px 0 36px; letter-spacing: 10px; }
  .floaters span { display: inline-block; animation: bob 3s ease-in-out infinite; }
  .floaters span:nth-child(2n) { animation-delay: -1.5s; }
  .floaters span:nth-child(3n) { animation-delay: -.7s; }

  .music {
    display: inline-flex; flex-direction: column; align-items: center; gap: 10px;
    border: 0; border-radius: 40px; padding: 28px 44px;
    background: var(--spotify); color: #fff; text-decoration: none;
    font: inherit; font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 800;
    box-shadow: 0 10px 0 #148a3e; cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .music .icon { font-size: clamp(3.5rem, 18vw, 5.5rem); line-height: 1; }
  .music:active { transform: translateY(8px); box-shadow: 0 2px 0 #148a3e; }
  .music:focus-visible { outline: 5px solid var(--blue); outline-offset: 5px; }
  .music.mom { background: var(--pink); box-shadow: 0 10px 0 #d9447a; animation-delay: -1.1s; }
  .music.mom:active { box-shadow: 0 2px 0 #d9447a; }
  .buttons { display: flex; flex-wrap: wrap; gap: 28px 24px; justify-content: center; }
  .buttons .music { width: min(300px, 100%); }

  @keyframes bob { 50% { transform: translateY(-10px); } }
  @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } }
  @keyframes pulse { 50% { scale: 1.05; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <h1>היי <span class="name"><span>נ</span><span>י</span><span>ב</span></span>! <span class="wave">👋</span></h1>
  <div class="floaters" aria-hidden="true"><span>🦄</span><span>🌸</span><span>🌈</span><span>🦋</span><span>🍓</span></div>

  <div class="buttons">
    <a class="music" id="spotify" href="spotify:">
      <span class="icon" aria-hidden="true">🎧</span>
      מוזיקה!
    </a>
    <a class="music mom" href="https://malissshany-cpu.github.io/family-hub/index.html">
      <span class="icon" aria-hidden="true">💖</span>
      הדף של אמא
    </a>
  </div>

<script>
  // Open the installed Spotify app; if it isn't installed, the page stays
  // visible, so fall back to the Spotify website.
  document.getElementById('spotify').addEventListener('click', ev => {
    ev.preventDefault();
    let left = false;
    const onHide = () => { if (document.hidden) left = true; };
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('blur', () => { left = true; }, { once: true });
    window.location.href = 'spotify:';
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onHide);
      if (!left && !document.hidden) window.location.href = 'https://open.spotify.com/';
    }, 1500);
  });
</script>
</body>
</html>
