<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף של ניב</title>
<meta name="description" content="הדף המיוחד של ניב.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
  :root {
    --bg: #fff3f8;
    --ink: #2b2140;
    --muted: #6b5f80;
    --pink: #ff6b9d;
    --orange: #ff9f43;
    --green: #4cd18a;
    --blue: #4d96ff;
    --purple: #9b5de5;
    --spotify: #1db954;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Varela Round", "Arial Hebrew", Arial, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(255, 107, 157, .18) 2px, transparent 0);
    background-size: 28px 28px;
    text-align: center;
  }
  [hidden] { display: none !important; }

  .view { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }

  h1 { font-size: clamp(3rem, 14vw, 6rem); margin: 0; line-height: 1.1; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  h1 .name span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  h1 .name span:nth-child(1) { color: var(--pink); }
  h1 .name span:nth-child(2) { color: var(--purple); animation-delay: -.8s; }
  h1 .name span:nth-child(3) { color: var(--orange); animation-delay: -1.6s; }
  h1 .wave { display: inline-block; animation: wave 1.6s ease-in-out infinite; transform-origin: 70% 70%; }

  .floaters { font-size: clamp(2rem, 9vw, 3rem); margin: 18px 0 36px; letter-spacing: 10px; }
  .floaters span { display: inline-block; animation: bob 3s ease-in-out infinite; }
  .floaters span:nth-child(2n) { animation-delay: -1.5s; }
  .floaters span:nth-child(3n) { animation-delay: -.7s; }

  .music {
    display: inline-flex; flex-direction: column; align-items: center; gap: 10px;
    border: 0; border-radius: 40px; padding: 28px 44px;
    background: var(--spotify); color: #fff; text-decoration: none;
    font: inherit; font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 800;
    box-shadow: 0 10px 0 #148a3e; cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .music .icon { font-size: clamp(3.5rem, 18vw, 5.5rem); line-height: 1; }
  .music:active { transform: translateY(8px); box-shadow: 0 2px 0 #148a3e; }
  .music:focus-visible { outline: 5px solid var(--blue); outline-offset: 5px; }
  .music.mom { background: var(--pink); box-shadow: 0 10px 0 #d9447a; animation-delay: -1.1s; }
  .music.mom:active { box-shadow: 0 2px 0 #d9447a; }
  .music.color { background: var(--orange); box-shadow: 0 10px 0 #d97a1c; animation-delay: -.5s; }
  .music.color:active { box-shadow: 0 2px 0 #d97a1c; }
  .buttons { display: flex; flex-wrap: wrap; gap: 28px 24px; justify-content: center; }
  .buttons .music { width: min(300px, 100%); }

  /* Music screen: a remote control for the Spotify app running in the
     background. A "stage" shows what's playing; the "shelf" holds the tiles.
     --tint comes from the current cover so the screen matches the music. */
  #music-view {
    --tint: 255, 107, 157;
    display: grid; grid-template-rows: auto auto 1fr; gap: 18px;
    align-items: start; justify-content: stretch;
    padding: 18px 18px 28px; min-height: 100%;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(var(--tint), .38), transparent 70%),
      var(--bg);
    transition: background 1s;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .round {
    width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    background: #fff; color: var(--ink); box-shadow: 0 6px 0 rgba(43, 33, 64, .14);
    display: grid; place-items: center; transition: transform .08s, box-shadow .08s;
  }
  .round svg { width: 46%; height: 46%; fill: currentColor; }
  .round:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(43, 33, 64, .14); }
  .back {
    display: flex; align-items: center; gap: 12px; border: 0; cursor: pointer; font: inherit;
    padding: 8px 18px 8px 8px; border-radius: 999px; background: #fff; color: var(--ink);
    box-shadow: 0 6px 0 rgba(43, 33, 64, .14); font-size: 1.4rem; font-weight: 800;
  }
  .back img, .back .ph { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; background: #ffe0ec; display: grid; place-items: center; font-size: 2rem; }
  .back svg { width: 34px; height: 34px; fill: currentColor; }
  [dir="rtl"] .back svg { transform: scaleX(-1); }
  .back:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(43, 33, 64, .14); }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .art {
    position: relative; width: min(44vh, 70vw, 420px); aspect-ratio: 1; border-radius: 36px;
    background: linear-gradient(135deg, #ffd1e3, #d9c6ff); overflow: hidden;
    box-shadow: 0 18px 40px rgba(var(--tint), .45), 0 6px 0 rgba(43, 33, 64, .12);
    display: grid; place-items: center; font-size: min(18vh, 30vw); transition: transform .3s;
  }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .playing-now .art { animation: breathe 3.2s ease-in-out infinite; }
  .eq { position: absolute; bottom: 14px; inset-inline-start: 14px; display: flex; gap: 5px; align-items: flex-end; height: 46px; padding: 8px 10px; border-radius: 16px; background: rgba(255, 255, 255, .85); opacity: 0; transition: opacity .3s; }
  .eq i { width: 8px; height: 100%; border-radius: 4px; background: var(--pink); transform-origin: bottom; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { background: var(--orange); animation-delay: -.3s; }
  .eq i:nth-child(3) { background: var(--green); animation-delay: -.6s; }
  .eq i:nth-child(4) { background: var(--blue); animation-delay: -.15s; }
  .playing-now .stage .eq { opacity: 1; }
  .now-title { font-size: clamp(1.4rem, 4.2vw, 2.2rem); font-weight: 800; line-height: 1.25; max-width: 90%; min-height: 2.5em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Media buttons read ⏮ ▶ ⏭ left to right everywhere, even in Hebrew. */
  .controls { direction: ltr; display: flex; gap: clamp(18px, 5vw, 40px); justify-content: center; align-items: center; margin: 4px 0 18px; }
  .ctl {
    width: 104px; height: 104px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    background: #fff; color: var(--purple); box-shadow: 0 7px 0 rgba(43, 33, 64, .14);
    display: grid; place-items: center; transition: transform .08s, box-shadow .08s;
  }
  .ctl svg { width: 46%; height: 46%; fill: currentColor; }
  .ctl:active { transform: translateY(6px); box-shadow: 0 1px 0 rgba(43, 33, 64, .14); }
  /* The big button wears a ring that fills up as the song or story goes on. */
  .play { position: relative; width: 156px; height: 156px; background: var(--spotify); color: #fff; box-shadow: 0 9px 0 #148a3e; }
  .play:active { box-shadow: 0 2px 0 #148a3e; }
  .play svg.icon { width: 44%; height: 44%; position: relative; }
  .play svg.ring { position: absolute; inset: -11px; width: calc(100% + 22px); height: calc(100% + 22px); transform: rotate(-90deg); fill: none; }
  .ring circle { stroke-width: 7; }
  .ring .track { stroke: rgba(43, 33, 64, .10); }
  .ring .bar { stroke: var(--orange); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }

  .shelf { display: grid; gap: 16px; align-content: start; }
  .shelf-head { display: flex; justify-content: flex-start; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 42vw), 1fr)); gap: 20px; }
  .tile {
    --c: var(--pink);
    position: relative; border: 0; padding: 10px 10px 14px; border-radius: 30px; cursor: pointer; font: inherit;
    background: var(--c); color: #fff; box-shadow: 0 8px 0 rgba(43, 33, 64, .18);
    display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    transition: transform .1s, box-shadow .1s, opacity .2s;
  }
  .tile:active { transform: translateY(6px) scale(.98); box-shadow: 0 2px 0 rgba(43, 33, 64, .18); }
  .tile .pic { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: rgba(255, 255, 255, .35); display: grid; place-items: center; font-size: 4rem; }
  .tile .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .label { font-size: clamp(1.05rem, 2.4vw, 1.35rem); font-weight: 800; line-height: 1.2; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .num {
    position: absolute; top: -10px; inset-inline-start: -10px; width: 64px; height: 64px; border-radius: 50%;
    background: #fff; color: var(--c); font-size: 2.2rem; font-weight: 800; display: grid; place-items: center;
    box-shadow: 0 4px 0 rgba(43, 33, 64, .18); z-index: 1;
  }
  .tile .eq { bottom: 10px; inset-inline-start: 10px; height: 38px; }
  .tile.playing { transform: scale(1.03); box-shadow: 0 0 0 6px #fff, 0 0 0 12px var(--c), 0 10px 24px rgba(43, 33, 64, .25); }
  .playing-now .tile.playing .eq { opacity: 1; }
  .tile.loading .pic::after { content: ''; position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%; border: 8px solid rgba(255, 255, 255, .5); border-top-color: #fff; animation: spin .8s linear infinite; }

  .notice {
    display: flex; flex-direction: column; align-items: center; gap: 14px; justify-self: center;
    max-width: 640px; background: #fff; border-radius: 30px; padding: 20px 26px;
    box-shadow: 0 8px 0 rgba(43, 33, 64, .12); font-size: clamp(1.2rem, 3vw, 1.6rem); font-weight: 700;
  }
  .notice .big { font-size: 3.4rem; line-height: 1; }
  .notice .music { font-size: 1.6rem; padding: 16px 30px; animation: none; }

  /* Landscape: stage on one side, tiles on the other. */
  @media (orientation: landscape) and (min-width: 900px) {
    #music-view { grid-template-columns: minmax(340px, 42%) 1fr; grid-template-rows: auto 1fr; column-gap: 28px; }
    .topbar { grid-column: 1 / -1; }
    .stage { position: sticky; top: 18px; }
    .art { width: min(46vh, 34vw, 440px); }
    .notice { grid-column: 2; }
    .shelf { grid-column: 2; grid-row: 2 / span 2; max-height: calc(100vh - 140px); overflow-y: auto; padding: 14px; margin: -14px; }
  }

  /* Coloring pages: pick one, print it, and that's it until tomorrow. */
  #color-view { display: grid; gap: 18px; align-content: start; padding: 18px 18px 28px; min-height: 100%; }
  .color-title { font-size: clamp(1.8rem, 6vw, 2.8rem); margin: 0; }
  #pages .pic { aspect-ratio: 3 / 4; background: #fff; }
  #pages .pic img { object-fit: contain; }
  .chosen { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .chosen img { height: min(56vh, 115vw, 680px); aspect-ratio: 3 / 4; background: #fff; border-radius: 30px; padding: 18px; box-shadow: 0 8px 0 rgba(43, 33, 64, .14); }
  .chosen-buttons { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; }
  .chosen-buttons .music { animation: none; }
  @media (orientation: landscape) {
    .chosen { flex-direction: row; justify-content: center; gap: 48px; }
    .chosen img { height: min(72vh, 680px); }
    .chosen-buttons { flex-direction: column; }
  }
  #print-sheet { display: none; }
  @media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    body > :not(#print-sheet) { display: none !important; }
    #print-sheet { display: block; }
    #print-sheet img { display: block; width: 100%; max-height: 250mm; margin: 0 auto; object-fit: contain; }
  }

  /* Parent panel: QR code for the phone manage page. */
  #parent { position: fixed; inset: 0; background: rgba(43, 33, 64, .55); display: grid; place-items: center; padding: 16px; z-index: 10; }
  #parent .card { background: #fff; border-radius: 28px; padding: 26px; width: min(560px, 100%); max-height: 100%; overflow: auto; direction: ltr; text-align: left; font-family: system-ui, sans-serif; }
  #parent h2 { margin: 0 0 8px; }
  #parent p { color: var(--muted); margin: 6px 0; }
  #qr { display: grid; place-items: center; margin: 14px 0; }
  #qr svg { width: min(320px, 70vw); height: auto; }
  #parent .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  #parent button { font: inherit; font-size: 1rem; padding: 12px 18px; border-radius: 14px; border: 1px solid #ddd; background: #f6f3f9; cursor: pointer; }
  #parent button.primary { background: var(--spotify); color: #fff; border-color: var(--spotify); }
  #parent code { font-size: .8rem; word-break: break-all; color: var(--muted); }

  @keyframes bob { 50% { transform: translateY(-10px); } }
  @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } }
  @keyframes pulse { 50% { scale: 1.05; } }
  @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  @keyframes breathe { 50% { transform: scale(1.025); } }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="home-view" class="view">
  <h1 id="hello">היי <span class="name"><span>נ</span><span>י</span><span>ב</span></span>! <span class="wave">👋</span></h1>
  <div class="floaters" aria-hidden="true"><span>🦄</span><span>🌸</span><span>🌈</span><span>🦋</span><span>🍓</span></div>

  <div class="buttons">
    <a class="music" id="spotify" href="spotify:">
      <span class="icon" aria-hidden="true">🎧</span>
      מוזיקה!
    </a>
    <a class="music mom" href="https://malissshany-cpu.github.io/family-hub/index.html">
      <span class="icon" aria-hidden="true">💖</span>
      הדף של אמא
    </a>
    <button class="music color" id="coloring">
      <span class="icon" aria-hidden="true">🖍️</span>
      דף צביעה
    </button>
  </div>
</main>

<main id="music-view" hidden>
  <div class="topbar">
    <button class="round" id="go-home" aria-label="הביתה"><svg viewBox="0 0 24 24"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></button>
  </div>

  <section class="stage">
    <div class="art" id="art"><span aria-hidden="true">🎧</span><div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
    <div class="now-title" id="now-title">בוחרים מה לשמוע 👇</div>
    <div class="controls">
      <button class="ctl" id="prev" aria-label="הקודם"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ctl play" id="toggle" aria-label="נגן">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="ring" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
        <svg class="icon" id="toggle-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctl" id="next" aria-label="הבא"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5v14l11-7z"/></svg></button>
    </div>
  </section>

  <div class="notice" id="notice" hidden></div>

  <section class="shelf">
    <div class="shelf-head" id="shelf-head" hidden></div>
    <div class="tiles" id="tiles"></div>
  </section>
</main>

<main id="color-view" hidden>
  <div class="topbar">
    <button class="round" id="color-home" aria-label="הביתה"><svg viewBox="0 0 24 24"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></button>
  </div>
  <h2 class="color-title" id="color-title"></h2>
  <div class="tiles" id="pages"></div>
  <section class="chosen" id="chosen" hidden>
    <img id="chosen-img" alt="">
    <div class="chosen-buttons" id="chosen-buttons">
      <button class="music" id="print-it"><span class="icon" aria-hidden="true">🖨️</span>להדפיס!</button>
      <button class="back" id="choose-other"><svg viewBox="0 0 24 24"><path d="M10 6 4 12l6 6v-4.5h10v-3H10z"/></svg>ציור אחר</button>
    </div>
  </section>
</main>

<div id="print-sheet"><img id="print-img" alt=""></div>

<div id="parent" hidden>
  <div class="card">
    <h2>Parent settings</h2>
    <div id="parent-status"></div>
    <p>Scan with your phone to manage the music: add playlists, albums and podcasts, and connect Spotify. Save the page on your phone to manage the tablet any time; anyone with that link can manage it.</p>
    <div id="qr"></div>
    <p><code id="manage-link"></code></p>
    <div class="row">
      <button id="parent-close" class="primary">Close</button>
      <button id="print-again" hidden>Allow another coloring page today</button>
      <button id="new-link">New link (old links stop working)</button>
      <button id="forget" hidden>Disconnect Spotify</button>
    </div>
    <details id="diag">
      <summary>Diagnostics</summary>
      <p><button id="diag-run">Check Spotify</button></p>
      <pre id="diag-out" style="white-space: pre-wrap; font-size: .8rem;"></pre>
    </details>
  </div>
</div>

<script>
  // The tablet never signs in itself. Parents manage it from setup.html on
  // their phones, which talks to this page through a private ntfy.sh topic.
  // Every message is encrypted with a key that only exists here and in the
  // manage link (inside the QR code), so ntfy.sh only ever sees ciphertext.
  const STORE = 'kidsbits.spotify';
  const CHANNEL = 'kidsbits.channel';
  const RELAY = 'https://ntfy.sh/';
  const API = 'https://api.spotify.com/v1';

  const $ = id => document.getElementById(id);
  const load = key => { try { return JSON.parse(localStorage.getItem(key)) || null; } catch { return null; } };
  const store = (key, v) => { try { v ? localStorage.setItem(key, JSON.stringify(v)) : localStorage.removeItem(key); } catch {} };
  const b64u = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

  // cfg: { tiles: [{uri, name, img}], cid, rt, at, exp, who, since, dev }.
  // Tiles can exist before Spotify is connected; rt is the Spotify sign-in.
  let cfg = load(STORE) || { tiles: [] };
  cfg.tiles ||= [];
  const save = () => store(STORE, cfg);
  const connected = () => !!cfg.rt;

  // Opening the Spotify app with replace() keeps the spotify: link out of the
  // page history, so the kiosk's back button doesn't reopen Spotify later.
  function openSpotifyApp() {
    let left = false;
    const onHide = () => { if (document.hidden) left = true; };
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('blur', () => { left = true; }, { once: true });
    location.replace('spotify:');
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onHide);
      if (!left && !document.hidden) location.href = 'https://open.spotify.com/';
    }, 1500);
  }

  $('spotify').addEventListener('click', ev => {
    ev.preventDefault();
    if (connected() && cfg.tiles.length) showMusic(); else openSpotifyApp();
  });
  $('go-home').addEventListener('click', showHome);

  function showHome() {
    $('music-view').hidden = true;
    $('home-view').hidden = false;
    stopPolling();
  }

  function showMusic() {
    listOf = null;
    $('home-view').hidden = true;
    $('music-view').hidden = false;
    $('shelf-head').hidden = true;
    renderTiles(cfg.tiles.map(t => ({ ...t, onTap: () => tapTile(t) })));
    refreshState();
    startPolling();
  }

  // --- Coloring pages -----------------------------------------------------------

  // One printed page a day. Printing is the browser's own print dialog, so
  // the tablet's default printer (picked once in that dialog) is used.
  const PRINTED = 'kidsbits.printed';
  const PAGES = [
    { id: 'unicorn', name: 'חד קרן' }, { id: 'butterfly', name: 'פרפר' },
    { id: 'flower', name: 'פרח' }, { id: 'rainbow', name: 'קשת' },
    { id: 'cat', name: 'חתול' }, { id: 'fish', name: 'דג' },
    { id: 'house', name: 'בית' }, { id: 'icecream', name: 'גלידה' },
  ];
  const pageSrc = id => 'coloring/' + id + '.svg';
  const today = () => new Date().toLocaleDateString('en-CA');
  const printedToday = () => { const p = load(PRINTED); return p?.day === today() ? PAGES.find(x => x.id === p.page) || PAGES[0] : null; };
  let chosen = null;

  $('coloring').addEventListener('click', () => { chosen = null; showColoring(); });
  $('color-home').addEventListener('click', () => { $('color-view').hidden = true; $('home-view').hidden = false; });
  $('choose-other').addEventListener('click', () => { chosen = null; showColoring(); });

  function showColoring() {
    $('home-view').hidden = true;
    $('color-view').hidden = false;
    const done = printedToday();
    const shown = done || chosen;
    $('color-title').textContent = done ? 'כבר הדפסנו היום! מחר אפשר עוד ציור 🌙' : chosen ? chosen.name : 'בוחרים ציור לצבוע 🖍️';
    $('pages').hidden = !!shown;
    $('chosen').hidden = !shown;
    $('chosen-buttons').hidden = !!done;
    if (shown) { $('chosen-img').src = pageSrc(shown.id); return; }
    renderTiles(PAGES.map(p => ({ uri: p.id, name: p.name, img: pageSrc(p.id), onTap: () => { chosen = p; showColoring(); } })), $('pages'));
  }

  $('print-it').addEventListener('click', async () => {
    if (!chosen || printedToday()) return showColoring();
    const img = $('print-img');
    img.src = pageSrc(chosen.id);
    try { await img.decode(); } catch {}
    store(PRINTED, { day: today(), page: chosen.id });
    showColoring();
    window.print();
  });

  // --- Spotify Web API -----------------------------------------------------

  class NeedsParent extends Error {}

  async function accessToken() {
    if (!connected()) throw new NeedsParent();
    if (cfg.at && cfg.exp > Date.now() + 60_000) return cfg.at;
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: cfg.rt, client_id: cfg.cid }),
    });
    if (res.status === 400 || res.status === 401) throw new NeedsParent();
    if (!res.ok) throw new Error('token ' + res.status);
    const t = await res.json();
    Object.assign(cfg, { at: t.access_token, exp: Date.now() + t.expires_in * 1000, rt: t.refresh_token || cfg.rt });
    save();
    return cfg.at;
  }

  async function api(method, path, body, retried) {
    const res = await fetch(API + path, {
      method,
      headers: { Authorization: 'Bearer ' + await accessToken(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401 && !retried) { cfg.exp = 0; return api(method, path, body, true); }
    if (res.status === 204 || res.status === 202) return null;
    const data = await res.json().catch(() => null);
    if (!res.ok) { const e = new Error(data?.error?.message || res.status); e.status = res.status; e.reason = data?.error?.reason; throw e; }
    return data;
  }

  // The Spotify app on this tablet is the speaker. Prefer the device we used
  // last time, then whatever is already active, then any tablet.
  async function device() {
    const { devices = [] } = await api('GET', '/me/player/devices') || {};
    const usable = devices.filter(d => !d.is_restricted);
    const pick = usable.find(d => d.id === cfg.dev) || usable.find(d => d.is_active)
      || usable.find(d => d.type === 'Tablet') || usable.find(d => d.type === 'Smartphone') || usable[0];
    if (pick && pick.id !== cfg.dev) { cfg.dev = pick.id; save(); }
    return pick;
  }

  // Each tile gets its own colour, so tiles that share a cover (like the
  // episodes of one podcast) still look different.
  const COLORS = ['#ff6b9d', '#ff9f43', '#22b573', '#4d96ff', '#9b5de5', '#e0a800', '#ef5da8', '#14b8a6'];
  const EQ = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';

  let state = null;     // Spotify's answer to /me/player
  let stateAt = 0;      // when it arrived, to move the progress ring between polls
  let pending = null;   // the tile just tapped, shown on the stage until Spotify catches up
  let listOf = null;

  async function act(fn) {
    try {
      hideNotice();
      const d = await device();
      if (!d) { pending = null; renderStage(); return wakeSpotify(); }
      await fn(d.id);
      setTimeout(refreshState, 700);
      setTimeout(refreshState, 2200);
    } catch (e) { pending = null; renderStage(); handle(e); }
  }

  // A song or episode picked from a list plays inside that list (its
  // playlist, album or show), so ⏭ moves on to the next one. Spotify also
  // accepts a bare episode in `uris` but silently doesn't play it on the
  // Android app, so a lone episode plays as its show from that episode.
  function play(tile, contextUri) {
    const key = tile.key || tile.uri;
    pending = { uri: tile.uri, name: tile.name, img: tile.img, until: Date.now() + 8000 };
    for (const b of $('tiles').children) b.classList.toggle('loading', b.dataset.uri === key);
    renderStage();
    const uri = tile.uri;
    act(async id => {
      let body;
      if (contextUri && contextUri !== uri) {
        body = { context_uri: contextUri, offset: { uri } };
      } else if (uri.startsWith('spotify:episode:')) {
        const show = (await api('GET', '/episodes/' + uri.split(':')[2]))?.show?.uri;
        body = show ? { context_uri: show, offset: { uri } } : { uris: [uri] };
      } else if (uri.startsWith('spotify:track:')) {
        body = { uris: [uri] };
      } else {
        body = { context_uri: uri };
      }
      return api('PUT', '/me/player/play?device_id=' + id, body);
    });
  }

  // Podcasts, playlists and albums open a list to pick from; songs, episodes
  // and artists play right away.
  function tapTile(tile) {
    if (/^spotify:(show|playlist|album):/.test(tile.uri)) showList(tile); else play(tile);
  }

  // The items inside a tile, as tiles. Throws if Spotify won't list them
  // (developer-mode apps can't read some playlists, e.g. Spotify's own).
  async function listItems(tile) {
    const [, kind, id] = tile.uri.split(':');
    if (kind === 'show') {
      const items = ((await api('GET', `/shows/${id}/episodes?limit=50`))?.items || []).filter(Boolean);
      // Niv can't read yet, so episodes get a big number: "פרק 3" → 3.
      const nums = items.map(ep => ep.name.match(/(?:פרק|episode|ep\.?|#)\s*(\d+)/i)?.[1]);
      const numbered = nums.some(Boolean);
      return items.map((ep, i) => ({ uri: ep.uri, name: ep.name, img: ep.images?.[0]?.url || tile.img, num: numbered ? (nums[i] || '★') : String(i + 1) }));
    }
    if (kind === 'album') {
      // Every song on an album shares its cover, so number them.
      const items = (await api('GET', `/albums/${id}/tracks?limit=50`))?.items || [];
      return items.filter(Boolean).map((t, i) => ({ uri: t.uri, name: t.name, img: tile.img, num: String(i + 1) }));
    }
    let page;
    try { page = await api('GET', `/playlists/${id}/tracks?limit=100&market=from_token`); }
    catch (e) { if (e instanceof NeedsParent) throw e; page = await api('GET', `/playlists/${id}/items?limit=100&market=from_token`); }
    return (page?.items || []).map(x => x?.track || x?.item)
      .filter(t => t?.uri && !t.is_local && t.is_playable !== false)
      .map(t => ({ uri: t.uri, name: t.name, img: (t.album?.images || t.images || [])[0]?.url || tile.img }));
  }

  async function showList(parent) {
    const tileEl = [...$('tiles').children].find(b => b.dataset.uri === parent.uri);
    tileEl?.classList.add('loading');
    try {
      hideNotice();
      const items = await listItems(parent);
      if (!items.length) { tileEl?.classList.remove('loading'); return play(parent); }
      listOf = parent;
      const back = document.createElement('button');
      back.className = 'back';
      back.setAttribute('aria-label', 'חזרה');
      back.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.4 4 7.4 12l8 8 1.8-1.8L11 12l6.2-6.2z"/></svg>';
      back.append(picture(parent.img, '🎧'));
      back.addEventListener('click', showMusic);
      $('shelf-head').replaceChildren(back);
      $('shelf-head').hidden = false;
      const tiles = items.map(t => ({ ...t, onTap: () => play(t, parent.uri) }));
      // Playlists and albums start with a "play everything" tile.
      if (!parent.uri.startsWith('spotify:show:')) {
        tiles.unshift({ key: 'all', uri: parent.uri, name: 'הכל', img: parent.img, num: '▶', onTap: () => play({ ...parent, key: 'all' }) });
      }
      renderTiles(tiles);
      scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      tileEl?.classList.remove('loading');
      if (e instanceof NeedsParent) return handle(e);
      // If Spotify won't list what's inside, just play the whole thing.
      lastError = describe(e);
      play(parent);
    }
  }

  // With nothing chosen yet, the big button starts the first tile.
  $('toggle').addEventListener('click', () => {
    if (!state?.item && !pending) {
      const first = $('tiles').firstElementChild;
      return first?.click();
    }
    const playing = state?.is_playing;
    if (state) { state.is_playing = !playing; stateAt = Date.now(); }
    pending = null;
    renderStage();
    act(id => playing ? api('PUT', '/me/player/pause?device_id=' + id) : api('PUT', '/me/player/play?device_id=' + id));
  });
  $('next').addEventListener('click', () => act(id => api('POST', '/me/player/next?device_id=' + id)));
  $('prev').addEventListener('click', () => act(id => api('POST', '/me/player/previous?device_id=' + id)));

  async function refreshState() {
    if ($('music-view').hidden || document.hidden) return;
    try {
      // Without additional_types, Spotify reports podcast episodes as no item.
      state = await api('GET', '/me/player?additional_types=episode');
      stateAt = Date.now();
      const now = [state?.context?.uri, state?.item?.uri, state?.item?.show?.uri];
      if (pending && (now.includes(pending.uri) || Date.now() > pending.until)) pending = null;
      renderStage();
    } catch (e) { handle(e); }
  }

  const PLAY_PATH = '<path d="M8 5v14l11-7z"/>';
  const PAUSE_PATH = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  function renderStage() {
    const item = state?.item;
    const shown = pending || (item && { name: item.name, img: (item.album?.images || item.images || item.show?.images || [])[0]?.url });
    const playing = pending ? true : !!state?.is_playing;
    $('music-view').classList.toggle('playing-now', playing && !!shown);
    $('toggle-icon').innerHTML = playing ? PAUSE_PATH : PLAY_PATH;
    $('toggle').setAttribute('aria-label', playing ? 'עצור' : 'נגן');
    $('now-title').textContent = shown?.name || 'בוחרים מה לשמוע 👇';
    setArt(shown?.img);
    renderRing();
    const current = pending ? [pending.uri] : [state?.context?.uri, item?.uri, item?.show?.uri].filter(Boolean);
    for (const b of $('tiles').children) {
      b.classList.toggle('playing', current.includes(b.dataset.uri));
      if (!pending) b.classList.remove('loading');
    }
  }

  // The ring around the big button fills as the song or story goes on.
  function renderRing() {
    const dur = state?.item?.duration_ms;
    let frac = 0;
    if (!pending && dur && state?.progress_ms != null) {
      frac = Math.min(1, (state.progress_ms + (state.is_playing ? Date.now() - stateAt : 0)) / dur);
    }
    $('ring').style.strokeDashoffset = String(100 - frac * 100);
  }

  let artSrc;
  function setArt(src) {
    if (src === artSrc) return;
    artSrc = src;
    const art = $('art');
    art.querySelector(':scope > img, :scope > span')?.remove();
    if (src) {
      const i = new Image();
      i.crossOrigin = 'anonymous';
      i.alt = '';
      i.onload = () => tintFrom(i);
      i.src = src;
      art.prepend(i);
    } else {
      const s = document.createElement('span');
      s.textContent = '🎧';
      art.prepend(s);
      $('music-view').style.removeProperty('--tint');
    }
  }

  // Tint the screen with the cover's average colour (Spotify's images allow
  // cross-origin reads).
  function tintFrom(img) {
    try {
      const c = document.createElement('canvas');
      c.width = c.height = 8;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0, 8, 8);
      const d = g.getImageData(0, 0, 8, 8).data;
      let r = 0, gr = 0, b = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; gr += d[i + 1]; b += d[i + 2]; }
      const n = d.length / 4;
      $('music-view').style.setProperty('--tint', pastel(r / n, gr / n, b / n).join(', '));
    } catch {}
  }

  // Keep the cover's hue but make it bright and soft, so dark covers don't
  // turn the screen grey.
  function pastel(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    const s = d < .06 ? .55 : .8, l = .72;
    const k = n => (n + h) % 6, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 4 - k(n), 1));
    return [f(5), f(3), f(1)].map(v => Math.round(v * 255));
  }

  function renderTiles(tiles, box = $('tiles')) {
    box.replaceChildren(...tiles.map((t, i) => {
      const b = document.createElement('button');
      b.className = 'tile';
      b.dataset.uri = t.key || t.uri;
      b.style.setProperty('--c', COLORS[i % COLORS.length]);
      const pic = document.createElement('span');
      pic.className = 'pic';
      if (t.img) { const im = new Image(); im.src = t.img; im.alt = ''; im.loading = 'lazy'; pic.append(im); } else pic.append('🎵');
      pic.insertAdjacentHTML('beforeend', EQ);
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = t.name;
      if (t.num) { const n = document.createElement('span'); n.className = 'num'; n.textContent = t.num; b.append(n); }
      b.append(pic, label);
      b.addEventListener('click', t.onTap);
      return b;
    }));
    renderStage();
  }

  function picture(src, fallback) {
    if (src) { const i = new Image(); i.src = src; i.alt = ''; return i; }
    const s = document.createElement('span');
    s.className = 'ph';
    s.textContent = fallback;
    return s;
  }

  // If Android has stopped the Spotify app, it vanishes from the device
  // list. Opening it once brings it back; the tablet's Home button returns here.
  function wakeSpotify() {
    notice('😴', 'המוזיקה נרדמה. לוחצים על הכפתור, ואז על כפתור הבית של הטאבלט כדי לחזור.', 'להעיר את המוזיקה 🎵', openSpotifyApp);
  }

  let lastError = '';
  const describe = e => `${new Date().toLocaleString()}: ${e.status || ''} ${e.reason || ''} ${e.message}`.replace(/\s+/g, ' ');

  function handle(e) {
    if (e instanceof NeedsParent) { stopPolling(); lastError = 'Spotify sign-in expired or missing'; return notice('🔌', 'צריך שאבא או אמא יחברו את המוזיקה מחדש.'); }
    if (e.status === 403 && e.reason === 'PREMIUM_REQUIRED') return notice('⭐', 'צריך ספוטיפיי פרימיום.');
    if (e.status === 404) return wakeSpotify();
    lastError = describe(e);
    console.warn(e);
  }

  function notice(emoji, text, buttonText, onClick) {
    const n = $('notice');
    const big = document.createElement('span');
    big.className = 'big';
    big.textContent = emoji;
    const p = document.createElement('span');
    p.textContent = text;
    n.replaceChildren(big, p);
    if (buttonText) {
      const b = document.createElement('button');
      b.className = 'music';
      b.textContent = buttonText;
      b.addEventListener('click', onClick);
      n.append(b);
    }
    n.hidden = false;
  }
  function hideNotice() { $('notice').hidden = true; }

  let poller, ticker;
  function startPolling() { stopPolling(); poller = setInterval(refreshState, 4000); ticker = setInterval(renderRing, 1000); }
  function stopPolling() { clearInterval(poller); clearInterval(ticker); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { hideNotice(); refreshState(); } });

  // --- Management channel ---------------------------------------------------

  let channel = load(CHANNEL);
  let channelKey, events;

  async function ensureChannel() {
    if (!channel) {
      channel = { t: 'kidsbits-' + b64u(crypto.getRandomValues(new Uint8Array(18))), k: b64u(crypto.getRandomValues(new Uint8Array(16))) };
      store(CHANNEL, channel);
    }
    channelKey = await crypto.subtle.importKey('raw', unb64u(channel.k), 'AES-GCM', false, ['encrypt', 'decrypt']);
  }

  // The Spotify sign-in must not be readable by everyone who has the manage
  // link (or from ntfy.sh's 12-hour cache), so phones encrypt it for this
  // tablet alone: ECDH with a key pair whose private half never leaves here.
  const ECDH = { name: 'ECDH', namedCurve: 'P-256' };
  let deviceKeys;
  async function ensureDeviceKeys() {
    if (deviceKeys) return deviceKeys;
    const saved = load('kidsbits.devicekey');
    if (saved) {
      deviceKeys = { pub: saved.pub, priv: await crypto.subtle.importKey('jwk', saved.priv, ECDH, false, ['deriveKey']) };
    } else {
      const pair = await crypto.subtle.generateKey(ECDH, true, ['deriveKey']);
      const pub = await crypto.subtle.exportKey('jwk', pair.publicKey);
      store('kidsbits.devicekey', { pub, priv: await crypto.subtle.exportKey('jwk', pair.privateKey) });
      deviceKeys = { pub, priv: pair.privateKey };
    }
    return deviceKeys;
  }
  async function openForDevice({ epk, box }) {
    const { priv } = await ensureDeviceKeys();
    const peer = await crypto.subtle.importKey('jwk', epk, ECDH, false, []);
    const key = await crypto.subtle.deriveKey({ name: 'ECDH', public: peer }, priv, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const raw = unb64u(box);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  const manageLink = () => new URL('setup.html', location.href).href + '#t=' + channel.t + '&k=' + channel.k;

  async function seal(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const sealed = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, channelKey, new TextEncoder().encode(JSON.stringify(obj)));
    return b64u([...iv, ...new Uint8Array(sealed)]);
  }
  async function unseal(text) {
    const raw = unb64u(text);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, channelKey, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  // Server-sent events keep one connection open instead of polling, which
  // stays well inside ntfy.sh's anonymous rate limits.
  async function listen() {
    await ensureChannel();
    events?.close();
    events = new EventSource(`${RELAY}${channel.t}/sse`);
    events.onmessage = async ev => {
      let msg;
      try {
        const m = JSON.parse(ev.data);
        if (m.event !== 'message') return;
        msg = await unseal(m.message);
      } catch { return; }
      if (msg.from === 'phone') await onCommand(msg);
    };
  }

  async function onCommand(msg) {
    if (msg.type === 'tiles' && Array.isArray(msg.tiles)) {
      cfg.tiles = msg.tiles.map(({ uri, name, img }) => ({ uri, name, img }));
    } else if (msg.type === 'auth' && msg.box) {
      let a;
      try { a = await openForDevice(msg); } catch { lastError = 'Could not read the Spotify sign-in from the phone'; }
      if (a?.rt) {
        Object.assign(cfg, { cid: a.cid, rt: a.rt, at: a.at, exp: a.exp, who: a.who, since: Date.now(), dev: undefined });
        lastError = '';
      }
    } else if (msg.type === 'print-again') {
      store(PRINTED, null);
      if (!$('color-view').hidden) showColoring();
    } else if (msg.type === 'forget') {
      cfg = { tiles: cfg.tiles };
    }
    if (msg.type !== 'get') {
      save();
      renderParent();
      if (!$('music-view').hidden) showMusic();
    }
    await reply(msg.id);
  }

  async function reply(re) {
    let speaker = null;
    if (connected()) { try { speaker = (await device())?.name || 'not running'; } catch (e) { if (!(e instanceof NeedsParent)) lastError = describe(e); } }
    const body = await seal({
      from: 'tablet', type: 'state', re,
      tiles: cfg.tiles, connected: connected(), who: cfg.who || '', since: cfg.since || 0, cid: cfg.cid || '',
      speaker, lastError, printed: printedToday()?.id || '', pub: (await ensureDeviceKeys()).pub,
    });
    await fetch(RELAY + channel.t, { method: 'POST', body }).catch(() => {});
  }

  // --- Parent panel -----------------------------------------------------------

  // Hold the "Hi Niv" title for two seconds to open the parent panel.
  let holdTimer;
  const hello = $('hello');
  hello.addEventListener('pointerdown', () => { holdTimer = setTimeout(openParent, 2000); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) hello.addEventListener(ev, () => clearTimeout(holdTimer));
  hello.addEventListener('contextmenu', ev => ev.preventDefault());

  function openParent() {
    $('parent').hidden = false;
    renderParent();
  }
  $('parent-close').addEventListener('click', () => { $('parent').hidden = true; });
  $('new-link').addEventListener('click', async () => {
    if (!confirm('Make a new manage link? Saved links on your phones will stop working.')) return;
    channel = null;
    store(CHANNEL, null);
    await listen();
    renderParent();
  });
  $('print-again').addEventListener('click', () => {
    store(PRINTED, null);
    if (!$('color-view').hidden) showColoring();
    renderParent();
  });
  $('forget').addEventListener('click', () => {
    if (!confirm('Disconnect Spotify from this tablet? The tiles stay.')) return;
    cfg = { tiles: cfg.tiles }; save(); renderParent(); showHome();
  });

  async function renderParent() {
    if ($('parent').hidden) return;
    const days = cfg.since ? Math.max(0, 182 - Math.floor((Date.now() - cfg.since) / 864e5)) : 0;
    $('parent-status').innerHTML = '';
    const p = document.createElement('p');
    p.textContent = (connected()
      ? `Spotify connected${cfg.who ? ' as ' + cfg.who : ''}; Spotify will ask to sign in again in about ${days} days.`
      : 'Spotify is not connected, so the music button opens the Spotify app.') + ` ${cfg.tiles.length} music tiles.`;
    const printed = printedToday();
    const pp = document.createElement('p');
    pp.textContent = printed ? `Coloring page printed today: ${printed.id}.` : 'No coloring page printed yet today.';
    $('parent-status').append(p, pp);
    $('print-again').hidden = !printed;
    $('forget').hidden = !connected();
    await ensureChannel();
    $('manage-link').textContent = manageLink();
    await showQr(manageLink());
  }

  async function showQr(text) {
    if (!window.qrcode) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
        s.onload = resolve; s.onerror = reject;
        document.head.append(s);
      });
    }
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  }

  // Shows what Spotify sees, to debug playback without a browser console.
  $('diag-run').addEventListener('click', async () => {
    const out = [];
    const step = async (label, fn) => {
      try { out.push(label + ': ' + JSON.stringify(await fn(), null, 1)); }
      catch (e) { out.push(`${label}: ERROR ${e.status || ''} ${e.reason || ''} ${e.message}`); }
      $('diag-out').textContent = out.join('\n\n');
    };
    $('diag-out').textContent = 'Checking…';
    await step('token', async () => (await accessToken(), 'ok, expires ' + new Date(cfg.exp).toLocaleTimeString()));
    await step('devices', async () => (await api('GET', '/me/player/devices'))?.devices?.map(d => `${d.name} | ${d.type} | active=${d.is_active} restricted=${d.is_restricted}`));
    await step('player', async () => { const p = await api('GET', '/me/player?additional_types=episode'); return p ? { device: p.device?.name, playing: p.is_playing, item: p.item?.name } : 'nothing playing (204)'; });
    const show = cfg.tiles.find(t => t.uri.startsWith('spotify:show:'));
    if (show) {
      let first;
      await step('episodes', async () => { const items = (await api('GET', `/shows/${show.uri.split(':')[2]}/episodes?limit=3`))?.items || []; first = items[0]; return items.map(e => e?.name + ' ' + e?.uri); });
      if (first) {
        await step('play episode', async () => {
          const d = await device();
          const res = await fetch(`${API}/me/player/play?device_id=${d.id}`, { method: 'PUT', headers: { Authorization: 'Bearer ' + await accessToken(), 'Content-Type': 'application/json' }, body: JSON.stringify({ context_uri: show.uri, offset: { uri: first.uri } }) });
          return res.status + ' ' + await res.text();
        });
        await new Promise(r => setTimeout(r, 2500));
        await step('after play', async () => { const p = await api('GET', '/me/player?additional_types=episode'); return p ? { playing: p.is_playing, item: p.item?.name, type: p.currently_playing_type } : '204'; });
      }
    }
    for (const t of cfg.tiles.filter(t => /^spotify:(playlist|album):/.test(t.uri))) {
      await step('songs in ' + t.name, async () => { const items = await listItems(t); return items.length + ' songs, e.g. ' + items.slice(0, 2).map(i => i.name).join(' / '); });
    }
    out.push('tiles: ' + cfg.tiles.map(t => t.uri).join(', '));
    out.push('last error: ' + (lastError || 'none'));
    $('diag-out').textContent = out.join('\n\n');
  });

  listen();
</script>
</body>
