<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>האקווריום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #1583c4; touch-action: none;
    font-family: "Rubik", "Arial Hebrew", Arial, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  [hidden] { display: none !important; }
  #tank { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .round {
    width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    background: #fff; color: #2b2140; box-shadow: 0 6px 0 rgba(13, 40, 80, .3);
    display: grid; place-items: center; text-decoration: none;
  }
  .round svg { width: 46%; height: 46%; fill: currentColor; }
  .round:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(13, 40, 80, .3); }
  .round:focus-visible { outline: 5px solid #ffd93b; outline-offset: 4px; }
  .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 16px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #snap {
    position: fixed; left: 20px; bottom: 20px; width: 116px; height: 116px;
    background: #ff6b9d; color: #fff; box-shadow: 0 8px 0 #c93f73;
    animation: pulse 2.2s ease-in-out infinite;
  }
  #snap:active { box-shadow: 0 2px 0 #c93f73; }

  .overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; }
  .dim { background: rgba(8, 30, 60, .72); }
  .card { background: #fff; border-radius: 32px; padding: 24px; width: min(760px, 100%); max-height: 100%; overflow: auto; text-align: center; color: #2b2140; }
  .card h2 { margin: 0 0 16px; font-size: 1.8rem; font-weight: 800; }
  #picker .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  #picker button.tpl { border: 4px solid #cfe6fb; border-radius: 22px; background: #f4faff; padding: 8px; cursor: pointer; }
  #picker button.tpl:active { transform: scale(.97); border-color: #4d96ff; }
  #picker svg { width: 100%; height: auto; display: block; }
  .row { display: flex; gap: 28px; justify-content: center; align-items: center; margin-top: 18px; }
  .big { width: 110px; height: 110px; }
  .ok { background: #2fbf71; color: #fff; box-shadow: 0 8px 0 #1e8e51; }
  .no { background: #ff5d5d; color: #fff; box-shadow: 0 8px 0 #c93a3a; }

  /* Camera: full-screen preview; the page snaps by itself when it sees the sheet. */
  #cam { background: #000; padding: 0; }
  #cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cam video { object-fit: cover; }
  #cam .guide {
    position: absolute; inset: 9% 7%; border: 6px dashed rgba(255, 255, 255, .75); border-radius: 28px;
    transition: border-color .15s;
  }
  #cam.seen .guide { border-color: #5cf08a; border-style: solid; }
  #cam .hint { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; color: #fff; font-size: 1.5rem; font-weight: 700; text-shadow: 0 2px 6px #000; }
  #cam .bar { z-index: 2; }
  #cam.oops .guide { animation: shake .4s; border-color: #ff7b7b; }

  #result { background: radial-gradient(circle at 50% 40%, #6fd3f2, #1670b8); }
  #result img { width: min(70vw, 105vh); height: auto; animation: bob 2.4s ease-in-out infinite; filter: drop-shadow(0 14px 14px rgba(0, 30, 70, .35)); }
  #result .inner { display: flex; flex-direction: column; align-items: center; }
  #gone img { width: min(320px, 60vw); height: auto; }

  #print-sheet { display: none; }
  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    body > *:not(#print-sheet) { display: none !important; }
    #print-sheet { display: block; width: 297mm; height: 209mm; overflow: hidden; page-break-inside: avoid; }
    #print-sheet svg { width: 100%; height: 100%; display: block; }
  }

  @keyframes pulse { 50% { scale: 1.07; } }
  @keyframes bob { 50% { transform: translateY(-14px) rotate(-2deg); } }
  @keyframes shake { 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<canvas id="tank"></canvas>

<div class="bar">
  <a class="round" href="index.html" aria-label="הביתה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></a>
  <button class="round" id="print" type="button" aria-label="להדפיס דף צביעה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v4H7zM5 8h14a3 3 0 0 1 3 3v6h-4v4H6v-4H2v-6a3 3 0 0 1 3-3zm3 8v3h8v-3z"/></svg></button>
</div>
<button class="round" id="snap" type="button" aria-label="לצלם דג"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5zm3 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg></button>

<div class="overlay dim" id="picker" hidden>
  <div class="card">
    <h2>איזה דג להדפיס?</h2>
    <div class="grid" id="picker-grid"></div>
    <div class="row"><button class="round" id="picker-close" type="button" aria-label="לסגור"><svg viewBox="0 0 24 24"><path d="M5 6.4 6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12z"/></svg></button></div>
  </div>
</div>

<div class="overlay" id="cam" hidden>
  <video playsinline muted></video>
  <canvas></canvas>
  <div class="guide"></div>
  <div class="hint">שמים את כל הדף בתוך המסגרת</div>
  <div class="bar"><button class="round" id="cam-close" type="button" aria-label="לסגור"><svg viewBox="0 0 24 24"><path d="M5 6.4 6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12z"/></svg></button></div>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<div class="overlay" id="result" hidden>
  <div class="inner">
    <img alt="">
    <div class="row">
      <button class="round big no" id="retry" type="button" aria-label="לצלם שוב"><svg viewBox="0 0 24 24"><path d="M12 5V1.5L7 6l5 4.5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button class="round big ok" id="accept" type="button" aria-label="לאקווריום!"><svg viewBox="0 0 24 24"><path d="M9.2 16.6 4.6 12 3 13.6l6.2 6.2L21 8l-1.6-1.6z"/></svg></button>
    </div>
  </div>
</div>

<div class="overlay dim" id="gone" hidden>
  <div class="card" style="width: min(460px, 100%)">
    <h2>להוציא את הדג מהאקווריום?</h2>
    <img alt="">
    <div class="row">
      <button class="round big ok" id="gone-no" type="button" aria-label="להשאיר"><svg viewBox="0 0 24 24"><path d="M5 6.4 6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12z"/></svg></button>
      <button class="round big no" id="gone-yes" type="button" aria-label="להוציא"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7z"/></svg></button>
    </div>
  </div>
</div>

<div id="print-sheet"></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ───────────────────────── Colouring sheets ─────────────────────────
  // A sheet is A4 landscape, in CSS pixels. Four bullseye marks sit in the
  // corners so a photo can be straightened; a strip of cells at the top says
  // which template it is and which way up the sheet is. Every creature is
  // drawn in a 900×560 box, facing right.
  const SW = 1123, SH = 794, MARK = 70;
  const CORNERS = [[65, 65], [SW - 65, 65], [SW - 65, SH - 65], [65, SH - 65]];
  const BOX = { x: 111, y: 127, w: 900, h: 560 };
  const STRIP = { x: 441.5, y: 30, cell: 24 };
  const WHITE = [[65, 250], [65, 540], [SW - 65, 250], [SW - 65, 540], [250, 65], [870, 65]];
  const OUT = 0.75;                                    // scanned fish are 675×420
  const OW = BOX.w * OUT, OH = BOX.h * OUT;
  const stripBits = id => [1, 0, 1, id >> 2 & 1, id >> 1 & 1, id & 1, ~id >> 2 & 1, ~id >> 1 & 1, ~id & 1, 1];

  const TEMPLATES = [
    { name: 'דג', colors: ['#ff9f43', '#ffd93b'],
      d: 'M860 280C820 150 700 85 600 80C560 30 470 10 400 30C420 60 420 90 400 115C340 140 290 170 240 220C180 170 110 120 40 110C70 180 80 230 70 280C80 330 70 380 40 450C110 440 180 390 240 340C300 410 380 460 470 470C640 490 820 410 860 280Z',
      lines: 'M640 170Q590 280 640 390M540 300Q470 330 495 385Q555 375 585 320ZM800 325Q822 342 848 322M110 200Q150 280 110 360M160 235Q180 280 160 325M420 108Q500 60 590 82M440 200q30 30 0 60M360 240q30 30 0 60M440 300q30 30 0 60M360 340q30 30 0 60',
      eye: [735, 225, 30] },
    { name: 'דג מלאך', colors: ['#c77dff', '#ff8fab'],
      d: 'M850 280C800 220 720 170 640 150C600 80 520 20 400 10C440 80 430 130 400 170C330 200 280 240 250 270C200 230 130 190 50 180C90 240 90 320 50 380C130 370 200 330 250 290C280 320 330 360 400 390C430 430 440 480 400 550C520 540 600 480 640 410C720 390 800 340 850 280Z',
      lines: 'M630 152Q595 280 630 408M510 120Q475 280 510 440M405 172Q385 280 405 388M800 300Q815 312 835 298M100 230Q130 280 100 330',
      eye: [735, 250, 26] },
    { name: 'לווייתן', colors: ['#4d96ff', '#9be7ff'],
      d: 'M870 300C870 180 740 100 580 100C420 100 300 170 230 260C190 250 150 210 140 150C110 170 80 170 40 140C30 220 80 290 150 320C200 420 340 480 520 480C700 480 870 420 870 300Z',
      lines: 'M868 335Q780 385 690 352M560 395Q520 465 440 455Q470 400 525 380ZM300 420Q420 400 480 470M360 380Q480 365 560 400M140 150Q150 210 120 250',
      eye: [765, 290, 20] },
    { name: 'דג נפוח', colors: ['#2fbf71', '#f9f871'],
      d: 'M720 280C720 150 620 50 490 50C370 50 280 130 258 235C215 205 165 175 100 165C132 215 138 250 132 280C138 310 132 345 100 395C165 385 215 355 258 325C280 430 370 510 490 510C620 510 720 410 720 280Z',
      lines: 'M690 300a18 20 0 1 0 36 0a18 20 0 1 0-36 0M480 300Q415 325 435 380Q490 370 520 318ZM360 150l14-34 14 34M470 110l14-34 14 34M580 150l14-34 14 34M330 260l14-34 14 34M360 420l14-34 14 34M470 460l14-34 14 34M580 420l14-34 14 34M140 215Q165 280 140 345',
      eye: [625, 205, 36] },
  ];
  TEMPLATES.forEach(t => { t.path = new Path2D(t.d); t.linePath = new Path2D(t.lines); });

  function sheetSvg(id, plain) {
    const t = TEMPLATES[id];
    const mark = ([cx, cy]) => {
      const m = MARK / 7, x = cx - MARK / 2, y = cy - MARK / 2;
      return `<rect x="${x}" y="${y}" width="${MARK}" height="${MARK}"/><rect x="${x + m}" y="${y + m}" width="${5 * m}" height="${5 * m}" fill="#fff"/><rect x="${x + 2 * m}" y="${y + 2 * m}" width="${3 * m}" height="${3 * m}"/>`;
    };
    const strip = stripBits(id).map((b, i) => b ? `<rect x="${STRIP.x + i * STRIP.cell}" y="${STRIP.y}" width="${STRIP.cell + .5}" height="${STRIP.cell}"/>` : '').join('');
    const [ex, ey, er] = t.eye;
    const fish = `<g transform="translate(${BOX.x} ${BOX.y})" fill="none" stroke="#111" stroke-linejoin="round" stroke-linecap="round">
      <path d="${t.d}" stroke-width="9" fill="#fff"/><path d="${t.lines}" stroke-width="4" stroke="#555"/>
      <circle cx="${ex}" cy="${ey}" r="${er}" stroke-width="5" fill="#fff"/><circle cx="${ex + er * .25}" cy="${ey}" r="${er * .5}" fill="#111" stroke="none"/></g>`;
    if (plain) return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${BOX.x - 20} ${BOX.y - 20} ${BOX.w + 40} ${BOX.h + 40}">${fish}</svg>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SW} ${SH}"><rect width="${SW}" height="${SH}" fill="#fff"/>
      <g fill="#000">${CORNERS.map(mark).join('')}${strip}</g>${fish}
      <text x="${SW / 2}" y="${SH - 34}" text-anchor="middle" direction="rtl" font-family="Rubik, Arial, sans-serif" font-weight="700" font-size="24" fill="#777">צובעים את ה${t.name}, מצלמים בטאבלט – והוא שוחה באקווריום!</text></svg>`;
  }

  // ───────────────────────── Reading a photo ─────────────────────────
  // Homography that maps src[i] to dst[i] (four point pairs).
  function homography(src, dst) {
    const A = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u], [0, 0, 0, x, y, 1, -v * x, -v * y, v]);
    }
    for (let c = 0; c < 8; c++) {
      let p = c;
      for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      if (Math.abs(A[p][c]) < 1e-9) return null;
      [A[c], A[p]] = [A[p], A[c]];
      for (let r = 0; r < 8; r++) if (r !== c) {
        const f = A[r][c] / A[c][c];
        for (let k = c; k < 9; k++) A[r][k] -= f * A[c][k];
      }
    }
    return A.map((row, i) => row[8] / row[i]);
  }
  const project = (h, x, y) => { const d = h[6] * x + h[7] * y + 1; return [(h[0] * x + h[1] * y + h[2]) / d, (h[3] * x + h[4] * y + h[5]) / d]; };

  // Finds the sheet in a (small) frame. Returns { marks } with every bullseye
  // seen, plus { h, tpl } (sheet → frame mapping, template id) when all four
  // are there and the strip reads cleanly.
  function findSheet(img) {
    const { width: w, height: h, data } = img, n = w * h;
    const lum = new Uint8Array(n), W1 = w + 1;
    const integ = new Uint32Array(W1 * (h + 1));
    for (let y = 0, i = 0; y < h; y++) {
      let row = 0;
      for (let x = 0; x < w; x++, i++) {
        const l = (data[i * 4] * 77 + data[i * 4 + 1] * 150 + data[i * 4 + 2] * 29) >> 8;
        lum[i] = l; row += l;
        integ[(y + 1) * W1 + x + 1] = integ[y * W1 + x + 1] + row;
      }
    }
    // Dark = clearly darker than its neighbourhood, so shadows don't matter.
    const r = Math.max(8, Math.round(w / 10)), dark = new Uint8Array(n);
    for (let y = 0, i = 0; y < h; y++) {
      const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
      for (let x = 0; x < w; x++, i++) {
        const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
        const sum = integ[y1 * W1 + x1] - integ[y0 * W1 + x1] - integ[y1 * W1 + x0] + integ[y0 * W1 + x0];
        if (lum[i] * (x1 - x0) * (y1 - y0) < sum * 0.7) dark[i] = 1;
      }
    }
    // Connected dark blobs.
    const seen = new Uint8Array(n), stack = new Int32Array(n), blobs = [];
    for (let s = 0; s < n; s++) {
      if (!dark[s] || seen[s]) continue;
      let top = 0, area = 0, sx = 0, sy = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
      stack[top++] = s; seen[s] = 1;
      while (top) {
        const i = stack[--top], x = i % w, y = (i - x) / w;
        area++; sx += x; sy += y;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && dark[i - 1] && !seen[i - 1]) { seen[i - 1] = 1; stack[top++] = i - 1; }
        if (x < w - 1 && dark[i + 1] && !seen[i + 1]) { seen[i + 1] = 1; stack[top++] = i + 1; }
        if (y > 0 && dark[i - w] && !seen[i - w]) { seen[i - w] = 1; stack[top++] = i - w; }
        if (y < h - 1 && dark[i + w] && !seen[i + w]) { seen[i + w] = 1; stack[top++] = i + w; }
      }
      if (area >= 5) blobs.push({ area, cx: sx / area, cy: sy / area, x0, x1, y0, y1, bw: x1 - x0 + 1, bh: y1 - y0 + 1 });
    }
    // A bullseye is a square ring with a dot sitting in its middle.
    let marks = [];
    for (const ring of blobs) {
      const { bw, bh } = ring, fill = ring.area / (bw * bh);
      if (bw < 10 || bh < 10 || bw > bh * 2.2 || bh > bw * 2.2 || fill < 0.28 || fill > 0.72) continue;
      const tol = Math.max(bw, bh) * 0.16;
      const dot = blobs.find(d => d !== ring && d.x0 > ring.x0 && d.x1 < ring.x1 && d.y0 > ring.y0 && d.y1 < ring.y1 &&
        Math.abs(d.cx - ring.cx) < tol && Math.abs(d.cy - ring.cy) < tol && d.area > ring.area * 0.12 && d.area < ring.area * 0.8);
      if (dot) marks.push({ x: (ring.cx + dot.cx) / 2, y: (ring.cy + dot.cy) / 2, size: ring.area });
    }
    marks.sort((a, b) => b.size - a.size);
    marks = marks.slice(0, 4);
    const out = { marks };
    if (marks.length < 4) return out;
    // Clockwise around the middle, then find which mark is the top-left one:
    // only the right turn of the sheet reads the strip correctly.
    const mx = (marks[0].x + marks[1].x + marks[2].x + marks[3].x) / 4, my = (marks[0].y + marks[1].y + marks[2].y + marks[3].y) / 4;
    const ring = marks.map(m => [m.x, m.y]).sort((a, b) => Math.atan2(a[1] - my, a[0] - mx) - Math.atan2(b[1] - my, b[0] - mx));
    for (let k = 0; k < 4; k++) {
      const hm = homography(CORNERS, [0, 1, 2, 3].map(i => ring[(i + k) % 4]));
      if (!hm) continue;
      const bits = [];
      for (let i = 0; i < 10; i++) {
        const [x, y] = project(hm, STRIP.x + (i + .5) * STRIP.cell, STRIP.y + STRIP.cell / 2);
        const xi = Math.round(x), yi = Math.round(y);
        bits.push(xi >= 0 && yi >= 0 && xi < w && yi < h ? dark[yi * w + xi] : -1);
      }
      const id = bits[3] << 2 | bits[4] << 1 | bits[5];
      if (bits.join('') === stripBits(id).join('') && TEMPLATES[id]) { out.h = hm; out.tpl = id; break; }
    }
    return out;
  }

  // Straightens the photo and cuts the creature out along its known outline.
  // `full` is the full-size frame, `h` maps sheet → that frame.
  function cutOut(full, h, tpl) {
    const { width: w, height: ht, data } = full;
    const at = (x, y, c) => data[(Math.min(ht - 1, Math.max(0, y)) * w + Math.min(w - 1, Math.max(0, x))) * 4 + c];
    // White paper next to the marks tells us the colour of the room's light.
    const white = [0, 0, 0];
    for (const [sx, sy] of WHITE) {
      const [px, py] = project(h, sx, sy).map(Math.round);
      for (let c = 0; c < 3; c++) { let s = 0; for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) s += at(px + dx, py + dy, c); white[c] += s / 49 / WHITE.length; }
    }
    const gain = white.map(v => Math.min(3, 246 / Math.max(40, v)));
    const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH;
    const ctx = cv.getContext('2d'), out = ctx.createImageData(OW, OH), o = out.data;
    for (let v = 0, i = 0; v < OH; v++) for (let u = 0; u < OW; u++, i += 4) {
      const [fx, fy] = project(h, BOX.x + (u + .5) / OUT, BOX.y + (v + .5) / OUT);
      const x0 = Math.floor(fx), y0 = Math.floor(fy), ax = fx - x0, ay = fy - y0;
      const px = [0, 0, 0];
      for (let c = 0; c < 3; c++) {
        px[c] = ((at(x0, y0, c) * (1 - ax) + at(x0 + 1, y0, c) * ax) * (1 - ay) + (at(x0, y0 + 1, c) * (1 - ax) + at(x0 + 1, y0 + 1, c) * ax) * ay) * gain[c];
      }
      const l = px[0] * .3 + px[1] * .59 + px[2] * .11;        // a little extra colour: paper photographs dull
      for (let c = 0; c < 3; c++) o[i + c] = l + (px[c] - l) * 1.25;
      o[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    const t = TEMPLATES[tpl];
    ctx.scale(OUT, OUT);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.fill(t.path);
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineJoin = 'round'; ctx.lineWidth = 11; ctx.strokeStyle = '#1d2433';
    ctx.stroke(t.path);                                       // a clean edge over the printed one
    return cv;
  }

  // A ready-coloured fish, shown while the tank is still nearly empty.
  function sampleFish(tpl) {
    const t = TEMPLATES[tpl], cv = document.createElement('canvas'); cv.width = OW; cv.height = OH;

  // ───────────────────────── Saved fish ─────────────────────────

  // ───────────────────────── The tank ─────────────────────────
  const tank = $('tank'), g = tank.getContext('2d');

    const water = c.createLinearGradient(0, 0, 0, H);
    water.addColorStop(0, '#8eeaf2'); water.addColorStop(.18, '#3fc1e6'); water.addColorStop(.6, '#1a86cc'); water.addColorStop(1, '#0c4c94');
    c.fillStyle = water; c.fillRect(0, 0, W, H);

  }

  function layout() {

  // Each fish is drawn once at its own size, tinted towards the water colour

  function addFish(src, opts = {}) {

  // ── touch: tap a fish and it darts off, tap the water to feed, hold a fish to remove it ──
  const HOLD_MS = 2500;
  let press = null;
  const fishAt = (x, y) => { for (let i = fishes.length - 1; i >= 0; i--) { const f = fishes[i]; if (((x - f.x) / (f.len * .5)) ** 2 + ((y - f.y) / (f.ht * .5)) ** 2 < 1) return f; } };

  $('gone-yes').onclick = () => { $('gone').hidden = true; fishes.splice(fishes.indexOf(leaving), 1); dbDel(leaving.id); fillWithSamples(); };

  // Ready-made fish keep the tank lively until three of her own are in it.
  function fillWithSamples() {
    const want = Math.max(0, 3 - fishes.filter(f => f.id).length);
    let have = fishes.filter(f => !f.id).length;
    for (let i = fishes.length - 1; i >= 0 && have > want; i--) if (!fishes[i].id) { fishes.splice(i, 1); have--; }
    for (; have < want; have++) addFish(sampleFish(have % TEMPLATES.length), { tpl: have, z: .2 + have * .25 });
  }

  // ───────────────────────── Printing ─────────────────────────
  $('picker-grid').innerHTML = TEMPLATES.map((t, i) => `<button class="tpl" type="button" data-tpl="${i}" aria-label="${t.name}">${sheetSvg(i, true)}</button>`).join('');
  $('print').onclick = () => { $('picker').hidden = false; };
  $('picker-close').onclick = () => { $('picker').hidden = true; };
  $('picker-grid').onclick = e => {
    const b = e.target.closest('[data-tpl]'); if (!b) return;

  // ───────────────────────── Camera ─────────────────────────
  const cam = $('cam'), video = cam.querySelector('video'), marksCv = cam.querySelector('canvas');
  const SMALL = 800, grab = document.createElement('canvas'), small = document.createElement('canvas');
  let stream = null, scanTimer = 0, steady = 0, lastPts = null, pending = null;

  function readFrame(source, sw, sh) {
    grab.width = sw; grab.height = sh;
    const gc = grab.getContext('2d', { willReadFrequently: true }); gc.drawImage(source, 0, 0, sw, sh);
    const k = Math.min(1, SMALL / Math.max(sw, sh));
    small.width = Math.round(sw * k); small.height = Math.round(sh * k);
    const sc = small.getContext('2d', { willReadFrequently: true }); sc.drawImage(grab, 0, 0, small.width, small.height);
    const found = findSheet(sc.getImageData(0, 0, small.width, small.height));
    found.k = k;
    found.cut = () => {
      const full = homography(CORNERS, CORNERS.map(([x, y]) => project(found.h, x, y).map(v => v / k)));
      return cutOut(gc.getImageData(0, 0, sw, sh), full, found.tpl);
    };
    return found;
  }

  async function openCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    } catch { $('file').click(); return; }               // no live camera: use the system camera instead
    video.srcObject = stream; await video.play().catch(() => {});
    cam.hidden = false; steady = 0; lastPts = null;
    scanTimer = setInterval(scan, 160);
  }
  function closeCamera() {
    clearInterval(scanTimer); scanTimer = 0;
    stream && stream.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null;
    cam.hidden = true; cam.classList.remove('seen');
  }
  function scan() {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
    const found = readFrame(video, vw, vh);
    // Show what the page sees: a dot on every corner mark it has found.
    const cw = cam.clientWidth, ch = cam.clientHeight, sc = Math.max(cw / vw, ch / vh), ox = (cw - vw * sc) / 2, oy = (ch - vh * sc) / 2;
    marksCv.width = cw; marksCv.height = ch;
    const mc = marksCv.getContext('2d');
    for (const m of found.marks) { mc.fillStyle = 'rgba(92,240,138,.85)'; mc.beginPath(); mc.arc(m.x / found.k * sc + ox, m.y / found.k * sc + oy, 22, 0, 7); mc.fill(); }
    cam.classList.toggle('seen', !!found.h);
    if (!found.h) { steady = 0; lastPts = null; return; }
    // Wait until the sheet is big enough and has stopped moving, so the photo is sharp.
    const pts = CORNERS.map(([x, y]) => project(found.h, x, y));
    const wide = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]) > small.width * .45;
    const still = lastPts && pts.every((p, i) => Math.hypot(p[0] - lastPts[i][0], p[1] - lastPts[i][1]) < small.width * .012);
    lastPts = pts; steady = wide && still ? steady + 1 : 0;
    if (steady >= 3) { const cut = found.cut(); const tpl = found.tpl; closeCamera(); showResult(cut, tpl); }
  }
  $('file').onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    const bmp = await createImageBitmap(file).catch(() => null); if (!bmp) return;
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const found = readFrame(bmp, Math.round(bmp.width * k), Math.round(bmp.height * k));
    if (found.h) showResult(found.cut(), found.tpl); else { $('snap').animate([{ transform: 'translateX(-12px)' }, { transform: 'translateX(12px)' }, { transform: 'none' }], 400); }
  };

  function showResult(cut, tpl) { pending = { cut, tpl }; $('result').querySelector('img').src = cut.toDataURL(); $('result').hidden = false; }
  $('snap').onclick = openCamera;
  $('cam-close').onclick = closeCamera;
  $('retry').onclick = () => { $('result').hidden = true; pending = null; openCamera(); };
  $('accept').onclick = async () => {
    $('result').hidden = true;
    const { cut, tpl } = pending; pending = null;
    const id = Date.now(), z = rnd(.55, 1);
    const f = addFish(cut, { id, tpl, z, x: W / 2, y: topY });       // dives in from the surface
    f.vy = H * .5; f.tx = W / 2; f.ty = H * .5; f.until = clock + 3;
    puff(W / 2, topY + 20, 26, 60);
    cut.toBlob(blob => blob && dbPut({ id, tpl, z, blob }), 'image/png');
    // Keep the tank at 20: the oldest fish swims off.
    const own = fishes.filter(x => x.id).sort((a, b) => a.id - b.id);
    while (own.length > MAX_FISH) { const old = own.shift(); fishes.splice(fishes.indexOf(old), 1); dbDel(old.id); }
    fillWithSamples();
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) closeCamera(); });

  // ───────────────────────── Start ─────────────────────────
  addEventListener('resize', layout);
  layout();
  (async () => {
    navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {});
    for (const rec of await dbAll()) {
      const bmp = await createImageBitmap(rec.blob).catch(() => null); if (!bmp) continue;
      const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH; cv.getContext('2d').drawImage(bmp, 0, 0, OW, OH);
      addFish(cv, { id: rec.id, tpl: rec.tpl, z: rec.z });
    }
    fillWithSamples();
  })();
  requestAnimationFrame(step);

  window.aquarium = { sheetSvg, fishes };                 // for tests
})();
</script>
</body>
</html>
